[project]
name = "financial_researcher_local"
version = "0.1.0"
description = "financial_researcher_local using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=0.157.0,<1.0.0"
]

[project.scripts]
financial_researcher_local = "financial_researcher_local.main:run"
run_crew = "financial_researcher_local.main:run"
train = "financial_researcher_local.main:train"
replay = "financial_researcher_local.main:replay"
test = "financial_researcher_local.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
